# Royaume Magique des Multiplications — Docker Compose
#
# Usage développement local : docker compose up -d db
# (la base est liée à 127.0.0.1 uniquement — jamais exposée sur Internet)
#
# Le service "app" sert de référence pour Coolify : build de l'image + healthcheck.
# Sur Coolify, les variables d'environnement sont configurées dans l'interface,
# jamais commitées ici.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jeux_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jeux_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-jeux_multiplication}
    volumes:
      # Volume persistant — NE JAMAIS supprimer lors d'un redéploiement.
      # PostgreSQL 18+ : le montage est /var/lib/postgresql (plus .../data).
      - pgdata:/var/lib/postgresql
    ports:
      # Port hôte 5434 : 5432/5433 sont déjà utilisés par d'autres projets locaux.
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jeux_user} -d ${POSTGRES_DB:-jeux_multiplication}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-jeux_user}:${POSTGRES_PASSWORD:-jeux_dev_password}@db:5432/${POSTGRES_DB:-jeux_multiplication}?schema=public
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
